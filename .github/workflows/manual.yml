name: CI/CD
on: [push]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/Hydrogen"
      - name: Install
        run: npm ci
      - name: Unit test
        run: npm run test
      - name: Integration test
        run: npm run e2e:ci
