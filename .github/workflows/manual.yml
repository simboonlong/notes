name: CI/CD
on: [push]
jobs:
  test:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: "16"
      - name: Install
        run: npm ci
      - name: Integration test
        run: npm run e2e:ci
